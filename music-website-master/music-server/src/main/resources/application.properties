mybatis.typeAliasesPackage=com.example.yin.model.domain
mybatis.mapperLocations=classpath:mapper/*.xml
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.deserialization.fail-on-unknown-properties=false
server.port=8888

spring.devtools.restart.enabled=false

spring.devtools.restart.additional-paths=src/main/java

spring.devtools.restart.exclude=WEB-INF/**

logging.level.org.springframework.boot.autoconfigure=ERROR

spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=5000
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-wait=3000

spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=2
spring.profiles.active=dev

# DeepSeek AI - 填写你的密钥（或在环境变量 DEEPSEEK_API_KEY 注入，避免密钥进 git）
ai.api.key=${DEEPSEEK_API_KEY:your-api-key}
ai.api.url=https://api.deepseek.com
ai.model=deepseek-chat

# JWT 认证
jwt.secret=yin-music-jwt-secret-key-please-change-me-to-32-bytes-minimum
jwt.expire=604800
jwt.header=Authorization
